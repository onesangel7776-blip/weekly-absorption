
name: Weekly Absorption Update

on:
  schedule:
    - cron: '0 12 * * 0'  # SUN 21:00 KST = SUN 12:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install requests
      - name: Run scoring engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINNHUB_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY || secrets.FINNHUB_API_KEY }}
        run: |
          python scoring_engine.py
      - name: Commit and push
        run: |
          git config --local user.email "bot@absorption.local"
          git config --local user.name "absorption-bot"
          git add absorption.json docs/absorption.json || true
          git diff --staged --quiet || git commit -m "weekly update $(date +%Y-%m-%d) - RISK logic"
          git push
