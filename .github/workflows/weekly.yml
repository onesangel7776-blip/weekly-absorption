name: 21 Ticker Command Center

on:
  schedule:
    - cron: '0 12 * * 0'  # 매주 일요일 21:00 KST = 12:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install yfinance pandas numpy requests
      - name: Run 21 ticker engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scoring_engine.py
      - name: Commit and push
        run: |
          git config --local user.email "bot@commandcenter.local"
          git config --local user.name "command-bot"
          git add absorption.json docs/absorption.json || true
          git diff --staged --quiet || git commit -m "21 ticker update $(date +%Y-%m-%d) - BOTTOM/TOP LONG/SHORT"
          git push
      - name: Discord notify
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python discord_notify.py
