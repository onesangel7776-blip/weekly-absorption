name: Weekly Absorption Update

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run scoring engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scoring_engine.py
          cat absorption.json

      - name: Commit results
        run: |
          mkdir -p docs
          cp absorption.json docs/absorption.json
          git config user.name "absorption-bot"
          git config user.email "bot@weekly-absorption.local"
          git add absorption.json docs/absorption.json docs/index.html || true
          git diff --staged --quiet || git commit -m "weekly update $(date -u +%Y-%m-%d)"
          git push
