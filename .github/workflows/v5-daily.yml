name: V5 Daily Auto - 21 Ticker Top2 DISTINCT 3TF

on:
  schedule:
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v5-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pytz || true

      - name: Run scoring_engine_v5
        run: |
          python scoring_engine_v5.py
          ls -lh absorption_v5.json best_tf_per_ticker.json || true

      - name: Run quantower collector 3TRACK
        run: |
          python quantower_delta_collector_v5_3TRACK.py || python data_collectors/quantower_delta_collector_v5_3TRACK.py || python quantower_delta_collector.py || echo "collector not found skip"
          ls -lh journal_data_v5.json || true

      - name: Sync to Pages docs
        run: |
          python sync_to_pages.py
          ls -lh docs/absorption_v5.json docs/v5-ma-delta/absorption_v5.json || true
          ls -lh docs/journal_data_v5.json docs/v5-ma-delta/journal_data_v5.json || true

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update V5 DAILY D2026-11-17 Top2 DISTINCT MGC M2K 6 slots"
          git push || echo "Push failed or no changes"
