name: V5 MA Delta Daily
on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  v5-calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MA Bot Scoring
        run: python scoring_engine_v5.py
      - name: Commit MA Bot Daily
        run: |
          git config user.name "ma-bot"
          git config user.email "ma-bot@github.com"
          git add absorption_v5.json journal_data_v5.json || true
          git commit -m "MA Bot Daily $(date -u +%Y-%m-%d)" || true
          git push || true
