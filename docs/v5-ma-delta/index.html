import json

import random

from pathlib import Path

# ================= FIXED V2 CONSTANTS =================
CAPITAL_USD = 50000  # fixed
PROP_DAILY_LOSS = -700
PROP_DAILY_PROFIT = 500
KRW_RATE = 1350

ABSORPTION_PATH = Path("absorption_v5.json")
# fallback for GitHub Pages / docs build
ABSORPTION_ALT = Path("docs/v5-ma-delta/absorption_v5.json")
JOURNAL_DIR = Path("docs/v5-ma-delta")

JOURNAL_DAILY_DIR = JOURNAL_DIR / "daily"

    "MNQ": 2.0,
    "MGC2": 10.0,
    "M2K2": 5.0,
    "M6J": 6.25,
    "TLT": 1.0,
    "DEFAULT": 2.0
}

# ================= UTIL =================
def load_absorption() -> dict:
    """Read absorption_v5.json first - FIXED V2"""
    for p in [ABSORPTION_PATH, ABSORPTION_ALT, Path("./absorption_v5.json")]:
        if p.exists():
            print(f"[LOAD] {p}")
            with open(p, "r", encoding="utf-8") as f:
                return json.load(f)
    raise FileNotFoundError("absorption_v5.json not found in any location")

def get_kst_now():
    # KST = UTC+9
    utc_now = datetime.datetime.now(datetime.timezone.utc)
    kst = utc_now.astimezone(datetime.timezone(datetime.timedelta(hours=9)))
    return kst

def dedup_slots(slots: list, date_str: str) -> list:
    """dedup by date+ticker+tf - FIXED V2"""
    seen = set()
    deduped = []
    for s in slots:
        ticker = str(s.get("ticker", "")).upper()
        tf = str(s.get("tf", "1m"))
        key = f"{date_str}|{ticker}|{tf}"
        if key in seen:
            continue
        seen.add(key)
        deduped.append(s)
    return deduped

def get_capital_ticker_rule(balance: float):
    """50K=5 tickers=15 slots, 60K=6 tickers=18 slots - FIXED V2"""
    if balance >= 60000:
        return 6, 18
    return 5, 15

# ================= VIRTUAL SIMULATION (NEW) =================
def simulate_virtual_pnl(slots: list, date_str: str):
    """
    VIRTUAL PnL simulation for slots where pnl == 0
    - win_rate 60% if score > 106 else 50%
    - TP stage: 50% TP1 only (50% qty), 25% TP2 (75% qty), 25% TP3 (100% qty)
    - PnL USD: win +80~+180, loss -120~-40
    - Prop rules: DailyLoss $700 / DailyProfit $500 -> BLOCKED remaining
    - Adds: pnl_usd, pnl_krw, status
    """
    daily_pnl = 0.0
    prop_stopped = False
    stop_reason = None

    # sort by score desc to simulate high score first (optional but realistic)
    # Keep original order for journaling but simulate in score order
    # We'll simulate in given order to keep TF sequence
    for idx, slot in enumerate(slots):
        ticker = slot.get("ticker", "UNKNOWN")
        tf = slot.get("tf", "1m")
        score = float(slot.get("score", slot.get("pnl", 0)) or 0)
        pnl_existing = float(slot.get("pnl", 0) or 0)
        entry = float(slot.get("entry", 0) or 0)
        tp1 = float(slot.get("tp1", 0) or 0)
        tp2 = float(slot.get("tp2", 0) or 0)
        tp3 = float(slot.get("tp3", 0) or 0)
        side = str(slot.get("side", "LONG")).upper()

        # If prop already stopped, mark BLOCKED
        if prop_stopped:
            slot["status"] = "BLOCKED"
            slot["pnl_usd"] = 0
            slot["pnl_krw"] = 0
            slot["block_reason"] = stop_reason
            continue

        # If pnl already exists (real), keep it and add to daily
        if pnl_existing != 0:
            # preserve existing
            slot["pnl_usd"] = pnl_existing
            slot["pnl_krw"] = int(pnl_existing * KRW_RATE)
            # infer status if missing
            if not slot.get("status"):
                slot["status"] = "TP3" if pnl_existing > 0 else "SL"
            daily_pnl += pnl_existing

            # check prop rules after adding
            if daily_pnl <= PROP_DAILY_LOSS:
                prop_stopped = True
                stop_reason = f"DailyLoss {daily_pnl} <= {PROP_DAILY_LOSS}"
                print(f"[PROP STOP] {stop_reason} at {ticker} {tf}")
            elif daily_pnl >= PROP_DAILY_PROFIT:
                prop_stopped = True
                stop_reason = f"DailyProfit {daily_pnl} >= {PROP_DAILY_PROFIT}"
                print(f"[PROP STOP] {stop_reason} at {ticker} {tf}")
            continue

        # --- VIRTUAL SIMULATION FOR pnl == 0 ---
        win_rate = 0.6 if score > 106 else 0.5
        is_win = random.random() < win_rate

        if is_win:
            # TP stage random
            r = random.random()
            if r < 0.5:
                # TP1 only 50% qty
                tp_stage = "TP1"
                qty_ratio = 0.5
                # simple USD: 80-120 for TP1
                base_pnl = random.uniform(80, 120)
                # adjust by TP distance ratio if available
                if entry and tp1:
                    dist_pct = abs(tp1 - entry) / max(abs(entry), 1)
                    # use distance to slightly scale: not too much to keep simple
                    base_pnl *= (0.8 + dist_pct * 100)
                    base_pnl = max(80, min(base_pnl, 180))
            elif r < 0.75:
                tp_stage = "TP2"
                qty_ratio = 0.75
                base_pnl = random.uniform(110, 155)
            else:
                tp_stage = "TP3"
                qty_ratio = 1.0
                base_pnl = random.uniform(140, 180)

            # LONG vs SHORT same USD logic for simplicity
            pnl_usd = round(base_pnl * qty_ratio + random.uniform(-5, 5), 2)
            # Ensure minimum win
            pnl_usd = max(pnl_usd, 50.0)

        else:
            # LOSS
            tp_stage = "SL"
            loss_val = random.uniform(40, 120)
            pnl_usd = round(-loss_val, 2)
            # cap loss range -120 to -40
            pnl_usd = max(-120, min(-40, pnl_usd))

        # Final USD/KRW/status
        slot["pnl_usd"] = round(pnl_usd, 2)
        slot["pnl_krw"] = int(pnl_usd * KRW_RATE)
        slot["status"] = tp_stage
        slot["qty_ratio"] = qty_ratio if is_win else 0
        slot["simulated"] = True
        slot["win_rate_used"] = win_rate
        # optional detailed calc note for transparency
        slot["pnl_note"] = f"VIRTUAL {side} {entry}->{tp_stage} score={score} wr={win_rate}"

        daily_pnl += pnl_usd

        print(f"[SIM] {ticker} {tf} score={score} {tp_stage} USD {pnl_usd} daily {daily_pnl:.2f}")

        # Prop check after this slot
        if daily_pnl <= PROP_DAILY_LOSS:
            prop_stopped = True
            stop_reason = f"DailyLoss {daily_pnl:.2f} <= {PROP_DAILY_LOSS}"
            print(f"[PROP STOP] {stop_reason}")
        elif daily_pnl >= PROP_DAILY_PROFIT:
            prop_stopped = True
            stop_reason = f"DailyProfit {daily_pnl:.2f} >= {PROP_DAILY_PROFIT}"
            print(f"[PROP STOP] {stop_reason}")

    return slots, daily_pnl, prop_stopped, stop_reason

# ================= BALANCE CALC (FIXED V2) =================
def calculate_balance_and_journal(slots: list, daily_pnl: float, date_str: str, date_kst: str):
    """
    balance = capital + pnl - FIXED V2
    Also handles 50K/60K rule
    """
    total_pnl = daily_pnl  # for this day
    # capital fixed 50000
    balance = CAPITAL_USD + total_pnl

    max_tickers, max_slots = get_capital_ticker_rule(balance)

    # ticker totals
    ticker_totals = {}
    for s in slots:
        t = s.get("ticker")
        ticker_totals[t] = ticker_totals.get(t, 0) + float(s.get("pnl_usd", s.get("pnl", 0)) or 0)

    # TopN distinct by pnl desc
    sorted_tickers = sorted(ticker_totals.items(), key=lambda x: x[1], reverse=True)
    topN = [k for k, _ in sorted_tickers[:max_tickers]]

    # best tf per ticker (max pnl)
    best = {}
    for ticker in topN:
        related = [s for s in slots if s.get("ticker") == ticker]
        if not related:
            continue
        best_slot = max(related, key=lambda x: float(x.get("pnl_usd", x.get("pnl", 0)) or 0))
        best[ticker] = {
            "tf": best_slot.get("tf"),
            "family": best_slot.get("family", best_slot.get("tf")),
            "entry": best_slot.get("entry"),
            "sl": best_slot.get("sl"),
            "pnl": best_slot.get("pnl_usd", best_slot.get("pnl", 0)),
            "status": best_slot.get("status", "UNKNOWN"),
            "reason": "Absorption + Delta Div" if str(best_slot.get("side")).upper() == "LONG" else "Exhaustion + Flip"
        }

    journal = {
        "date": date_str,
        "date_kst": date_kst,
        "capital_usd": CAPITAL_USD,
        "balance": balance,
        "daily_pnl": round(daily_pnl, 2),
        "daily_pnl_krw": int(daily_pnl * KRW_RATE),
        "max_tickers": max_tickers,
        "max_slots": max_slots,
        "slots_count": len(slots),
        "topN": topN,
        "topN_distinct": topN,
        "ticker_totals": ticker_totals,
        "best_tf_per_ticker": best,
        "slots": slots,
        "prop_rules": {
            "daily_loss": PROP_DAILY_LOSS,
            "daily_profit": PROP_DAILY_PROFIT,
            "stopped": daily_pnl <= PROP_DAILY_LOSS or daily_pnl >= PROP_DAILY_PROFIT
        },
        "version": "V5 VIRTUAL TP/SL SIM"
    }
    return journal

# ================= SAVE (FIXED V2) =================
def save_journal(journal: dict, date_str: str):
    JOURNAL_DIR.mkdir(parents=True, exist_ok=True)
    JOURNAL_DAILY_DIR.mkdir(parents=True, exist_ok=True)

    # main journal
    with open(JOURNAL_PATH, "w", encoding="utf-8") as f:
        json.dump(journal, f, ensure_ascii=False, indent=2)
    print(f"[SAVE] {JOURNAL_PATH}")

    # daily copy
    daily_file = JOURNAL_DAILY_DIR / f"{date_str}.json"
    # date_str like D2026-05-13 -> clean for filename
    clean_date = date_str.replace("D", "")
    daily_file = JOURNAL_DAILY_DIR / f"{clean_date}.json"
    with open(daily_file, "w", encoding="utf-8") as f:
        json.dump(journal, f, ensure_ascii=False, indent=2)
    print(f"[SAVE] {daily_file}")
