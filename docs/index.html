<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Weekly Absorption - SUN 21:00 KST</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0b1020;color:#e5e7eb;font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
.card{background:#11172b;border:1px solid #1f2a4a;border-radius:16px}
.risk-off{color:#f87171}.risk-on{color:#4ade80}.neutral{color:#fbbf24}
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-6xl mx-auto">
<h1 class="text-2xl md:text-3xl font-bold text-sky-300">Weekly Absorption - SUN 21:00 KST</h1>
<div id="meta" class="mt-2 text-sm text-slate-400">Loading...</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
<div class="card p-4"><div class="text-xs text-slate-400">BIAS</div><div id="bias" class="text-xl font-bold mt-1">-</div></div>
<div class="card p-4"><div class="text-xs text-slate-400">DXY Proxy (DTWEXBGS)</div><div id="dxy" class="text-xl font-bold mt-1">-</div><div id="dxy_date" class="text-[10px] text-slate-500"></div></div>
<div class="card p-4"><div class="text-xs text-slate-400">US10Y (DGS10)</div><div id="us10y" class="text-xl font-bold mt-1">-</div><div id="us10y_date" class="text-[10px] text-slate-500"></div></div>
<div class="card p-4"><div class="text-xs text-slate-400">VIX (VIXCLS)</div><div id="vix" class="text-xl font-bold mt-1">-</div><div id="vix_date" class="text-[10px] text-slate-500"></div></div>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
<div class="card p-4 md:col-span-2">
<h2 class="text-sky-300 font-bold">COT Summary</h2>
<div id="cot" class="mt-3 text-sm whitespace-pre-wrap text-slate-300"></div>
</div>
<div class="card p-4">
<h2 class="text-sky-300 font-bold">Candidates / Scores</h2>
<div id="candidates" class="mt-3 text-sm"></div>
</div>
</div>

<div class="card p-4 mt-6">
<h2 class="text-sky-300 font-bold">Raw JSON</h2>
<pre id="raw" class="mt-3 text-[11px] overflow-auto max-h-[500px] text-slate-400"></pre>
</div>

<div class="mt-6 text-[11px] text-slate-500">Auto update: Sunday 21:00 KST / cron: 0 12 * * 0 UTC / Sources: FRED, CFTC COT, Finnhub</div>
</div>

<script>
async function load(){
 try{
  const res = await fetch('./absorption.json?v='+Date.now());
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j = await res.json();
  document.getElementById('meta').innerText = `Date: ${j.date} / ${j.kst_run||''} / Candidates ${j.candidates?.length||0} / COT: ${j.cot?.status||'-'}`;
  const biasEl = document.getElementById('bias');
  biasEl.innerText = j.bias || j.fred?.bias || '-';
  biasEl.className = 'text-xl font-bold mt-1 ' + ((j.bias||'').includes('RISK_OFF') ? 'risk-off' : (j.bias||'').includes('RISK_ON') ? 'risk-on' : 'neutral');
  const dxy = j.fred?.DXY_proxy; if(dxy){ document.getElementById('dxy').innerText = dxy.latest?.value || '-'; document.getElementById('dxy_date').innerText = dxy.latest?.date || '' }
  const us10y = j.fred?.US10Y; if(us10y){ document.getElementById('us10y').innerText = (us10y.latest?.value||'-')+' %'; document.getElementById('us10y_date').innerText = us10y.latest?.date || '' }
  const vix = j.fred?.VIX; if(vix){ document.getElementById('vix').innerText = vix.latest?.value || '-'; document.getElementById('vix_date').innerText = vix.latest?.date || '' }
  const cotEl = document.getElementById('cot');
  if(j.cot){ cotEl.innerText = `status: ${j.cot.status}\nraw_lines: ${j.cot.meta?.raw_lines||''} / samples: ${j.cot.meta?.samples||''}\n\nsource: ${j.cot.source||''}`; }
  const candEl = document.getElementById('candidates');
  if(j.candidates && j.candidates.length){ candEl.innerHTML = j.candidates.map(c=>`<div class="border-b border-slate-800 py-2">${c.ticker||c} - ${c.score||''}</div>`).join(''); }
  else { let s = j.scores ? JSON.stringify(j.scores,null,2) : 'No candidates (RISK_OFF filter)'; candEl.innerHTML = `<pre class="text-xs whitespace-pre-wrap">${s}</pre>`; }
  document.getElementById('raw').innerText = JSON.stringify(j,null,2);
 }catch(e){
  document.getElementById('meta').innerText = 'absorption.json not found - run Actions or check path: '+e;
  document.getElementById('raw').innerText = String(e);
 }
}
load();
</script>
</body>
</html>
